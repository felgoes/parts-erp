<section class="dashboard-metrics" aria-label="Indicadores da operação">
  <button class="revenue-card" type="button" (click)="financialRequested.emit()">
    <span class="revenue-top">
      <span class="revenue-kicker">Resumo financeiro</span>
      <span class="revenue-action"
        >Abrir análise
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 17 17 7M8 7h9v9" />
        </svg>
      </span>
    </span>
    <span class="revenue-main">
      <span class="revenue-label">Faturamento no período</span>
      <span class="revenue-value">{{ summary().revenue_month | currency: 'BRL' }}</span>
    </span>
    <span class="revenue-foot">
      <span class="revenue-signal" aria-hidden="true"></span>
      Vendas confirmadas no período
    </span>
  </button>

  <app-dashboard-metric-card
    label="Vendas confirmadas"
    [value]="summary().confirmed_sales.toString()"
    [meta]="summary().cancelled_sales + ' canceladas'"
    [detail]="(summary().cancelled_amount | currency: 'BRL') + ' fora da receita'"
    iconPath="M6 3.5h9l3 3v14H6zM9 9h6M9 13h6M9 17h3"
    route="/invoices"
  />

  <app-dashboard-metric-card
    label="Vendas a enviar"
    [value]="summary().sales_to_ship.toString()"
    [meta]="summary().sales_to_ship ? 'Aguardando despacho' : 'Fila em dia'"
    [tone]="summary().sales_to_ship > 0 ? 'attention' : 'positive'"
    iconPath="m4 7 8-4 8 4-8 4zM4 7l8 4v10l-8-4zM20 7l-8 4v10l8-4z"
    route="/marketplace"
  />

  <app-dashboard-metric-card
    label="Produtos ativos"
    [value]="summary().products_count.toString()"
    meta="Disponíveis no catálogo"
    iconPath="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"
    route="/products"
  />

  <app-dashboard-metric-card
    label="Estoque baixo"
    [value]="summary().low_stock_count.toString()"
    [meta]="summary().low_stock_count ? 'Reposição necessária' : 'Estoque equilibrado'"
    [tone]="summary().low_stock_count > 0 ? 'attention' : 'positive'"
    iconPath="M12 4 21 20H3zM12 9v5M12 17.5v.5"
    route="/products"
  />
</section>
