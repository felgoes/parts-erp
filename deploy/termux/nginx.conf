worker_processes 1;
pid /data/data/com.termux/files/home/parts-erp/data/run/nginx.pid;
error_log /data/data/com.termux/files/home/parts-erp/data/logs/nginx-error.log warn;

events { worker_connections 256; }

http {
  server_names_hash_bucket_size 64;
  include /data/data/com.termux/files/usr/etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr - $status "$request_method $uri $server_protocol"';
  access_log /data/data/com.termux/files/home/parts-erp/data/logs/nginx-access.log safe;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  server {
    listen 0.0.0.0:8080;
    server_name erp.goesautoparts.com.br _;
    root /data/data/com.termux/files/home/parts-erp/frontend/dist/frontend/browser;
    index index.html;
    client_max_body_size 2m;

    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff|woff2)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  server {
    listen 0.0.0.0:8080;
    server_name www.goesautoparts.com.br;
    root /data/data/com.termux/files/home/goesautoparts-site/dist/site/browser;
    index index.html;

    # O catálogo público é servido neste host, mas seus dados vêm da API do ERP.
    # Sem este proxy, o fallback do SPA retornava index.html em vez de JSON.
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff|woff2)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://erp.goesautoparts.com.br; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
