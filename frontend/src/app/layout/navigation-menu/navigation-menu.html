<nav aria-label="Menu principal">
  <a
    class="nav-item nav-overview"
    routerLink="/dashboard"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    (click)="closeRequested.emit()"
  >
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" />
      </svg>
    </span>
    <span class="nav-copy">Visão geral</span>
  </a>

  @for (section of sections(); track section.label) {
    <div class="nav-section">
      <p class="nav-section-label">{{ section.label }}</p>
      @for (item of section.items; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeRequested.emit()"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path [attr.d]="item.iconPath" /></svg>
          </span>
          <span class="nav-copy">{{ item.label }}</span>
        </a>
      }
    </div>
  }

  @if (isAdmin()) {
    <div #adminSection class="nav-section admin-section">
      <p class="nav-section-label">Administração</p>
      <button
        class="nav-item configuration-toggle"
        type="button"
        [class.active]="isConfigurationActive()"
        [attr.aria-expanded]="settingsOpen()"
        aria-controls="configuration-links"
        (click)="toggleSettings()"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5l-.3 2.5a8 8 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.3 2.5h5l.3-2.5a8 8 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5c.07-.33.1-.66.1-1Z"
            />
          </svg>
        </span>
        <span class="nav-copy">Configurações</span>
        <span class="nav-chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
        </span>
      </button>
      @if (settingsOpen()) {
        <div id="configuration-links" class="nav-children">
          @for (item of configurationItems; track item.path) {
            <a
              class="nav-item nav-child"
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeRequested.emit()"
            >
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path [attr.d]="item.iconPath" /></svg>
              </span>
              <span class="nav-copy">{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </div>
  }
</nav>
